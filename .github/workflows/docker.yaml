name: Docker Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ghcr.io/unexistencer/extafia-bot:latest -t ghcr.io/unexistencer/extafia-bot:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/unexistencer/extafia-bot:latest
          docker push ghcr.io/unexistencer/extafia-bot:${{ github.sha }}


